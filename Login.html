<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Space Colony</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="auth-page">
  <div class="space-bg"></div>
  <main class="auth-shell">
    <form class="auth-card">
      <a href="index.html" class="brand auth-brand">🚀 <span>Space Colony</span></a>
      <h1>Welcome back</h1>
      <p>Login to continue building your colony.</p>
      <label>Username or Email</label>
      <input type="text" class="form-control" placeholder="commander@example.com" />
      <label>Password</label>
      <input type="password" class="form-control" placeholder="••••••••" />
      <button type="button" class="primary-btn full btn">Login</button>
      <p class="auth-switch">New commander? <a href="signup.html">Create account</a></p>
    </form>
  </main>
</body>
</html>
