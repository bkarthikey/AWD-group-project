<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Space Colony</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="auth-page">
  <div class="space-bg"></div>
  <main class="auth-shell">
    <form class="auth-card">
      <a href="index.html" class="brand auth-brand">🚀 <span>Space Colony</span></a>
      <h1>Create colony</h1>
      <p>Start your survival mission on Kepler-77X.</p>
      <label>Commander Name</label>
      <input type="text" placeholder="Commander Nova" />
      <label>Email</label>
      <input type="email" placeholder="you@example.com" />
      <label>Password</label>
      <input type="password" placeholder="Create a password" />
      <button type="button" class="primary-btn full">Create Account</button>
      <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
    </form>
  </main>
</body>
</html>
